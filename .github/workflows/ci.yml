name: ci
on: [push, pull_request]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secrets and generated files
        run: |
          if git ls-files | grep -E '(^|/)(node_modules|bin|obj)/|(^|/)\.env$'; then exit 1; fi
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ehsms_dev
          POSTGRES_PASSWORD: ehsms
          POSTGRES_DB: ehsms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ehsms_dev -d ehsms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__EhSms: "Host=localhost;Port=5432;Database=ehsms;Username=ehsms_dev;Password=ehsms"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.411'}
      - run: dotnet restore backend/Ehsms.sln --locked-mode
      - run: dotnet list backend/Ehsms.sln package --vulnerable --include-transitive
      - run: dotnet build backend/Ehsms.sln --no-restore --configuration Release
      - name: Prepare Postgres schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          export PGPASSWORD=ehsms
          # Apply the foundation schema only. It contains every table the integration tests
          # and Development seeders use (saas/org/iam/platform). Later waves (002-004) add
          # modules not covered by tests and have cross-file FK ordering issues
          # (e.g. 003 references asset schema created in 004), so they are skipped.
          # RLS scripts (005+) are also skipped: they enforce app.current_tenant_id which
          # the tests don't simulate, matching the local dev database.
          psql -h localhost -U ehsms_dev -d ehsms -v ON_ERROR_STOP=1 -q -f database/ddl/001-foundation.sql
      - run: dotnet test backend/Ehsms.sln --no-build --configuration Release
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.2', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm test -- --browsers=ChromeHeadless
        working-directory: frontend
      - run: npm run build
        working-directory: frontend