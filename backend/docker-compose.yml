version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ehsms-postgres
    environment:
      POSTGRES_DB: ehsms
      POSTGRES_USER: ehsms
      POSTGRES_PASSWORD: ehsms_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/seed:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehsms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
